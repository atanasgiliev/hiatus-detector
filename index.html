<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" /> 
    <title>Hiatus Detector (Web Version)</title> 
    <link rel="stylesheet" href="style.css"> 
  </head> 
  <body> 
    
    <h1>Greek Hiatus Detector</h1> 
    
    <p>Select a UTF-8 Greek text file:</p> 
    <input type="file" id="fileInput" accept=".txt"> 
    
    <fieldset style="margin-top: 1em;">
      <legend>Optional Hiatus Rules</legend>
      
      <label>
        <input type="checkbox" id="breakRough">
        Break if second vowel has rough breathing
      </label><br>

      <label>
        <input type="checkbox" id="breakDash">
        Break if dash intervenes
      </label><br>

      <label>
        <input type="checkbox" id="breakPunct">
        Break if punctuation intervenes
      </label>
    </fieldset>
    
    <button id="runBtn">Run Hiatus Detector</button> 
    
    <div id="status"></div> 
    
    <h2>Output</h2> 
    <div id="output"></div> 
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js">
      </script> 
    <script src="app.js"></script> 
  
  </body> 
</html>
